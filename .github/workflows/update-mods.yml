name: Update framework mods

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh mods table
        run: node scripts/fetch-framework-mods.mjs
        env:
          NEXUS_MODS_API_KEY: ${{ secrets.NEXUS_MODS_API_KEY }}
      - name: Commit updated table
        run: |
          if git diff --quiet -- src/data/framework-mods.json; then
            echo "mods table unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/framework-mods.json
            git commit -m "Update framework mods table"
            git push
          fi
