pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm run lint
    - name: check
      run: pnpm run check
    - name: unit tests
      run: pnpm run test:unit

pre-push:
  jobs:
    - name: build
      run: pnpm run build
    - name: check links
      run: pnpm run check:links
    - name: e2e tests
      run: pnpm run test:e2e
